<div class="page-container">
    <mat-card class="filters-card">
        <div class="filters-row">

            <mat-form-field appearance="outline" class="filter-field search-field">
                <mat-label>Buscar por nome ou e-mail</mat-label>

                <input
                        matInput
                        [formControl]="searchControl"
                        placeholder="Ex: João Silva"
                />

                <mat-icon matPrefix>search</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="filter-field">
                <mat-label>Filtrar por Empresa</mat-label>

                <mat-select [formControl]="companyFilter">
                    <mat-option value="">
                        Todas as empresas
                    </mat-option>

                    <mat-option
                            *ngFor="let c of companies()"
                            [value]="c.id"
                    >
                        {{ c.razaoSocial || c.nomeFantasia || c.name }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

            <div class="filter-actions">
                <button
                        mat-flat-button
                        color="accent"
                        (click)="openUserDialog()"
                >
                    <mat-icon>person_add</mat-icon>
                    Criar Usuário
                </button>
            </div>

        </div>
    </mat-card>

    <mat-progress-bar
            mode="indeterminate"
            *ngIf="loading()"
    >
    </mat-progress-bar>

    <div class="table-container">

        <table
                mat-table
                [dataSource]="users()"
                class="mat-elevation-z2 full-width"
        >

            <!-- Nome -->
            <ng-container matColumnDef="name">

                <th mat-header-cell *matHeaderCellDef>
                    Nome
                </th>

                <td mat-cell *matCellDef="let u">
                    {{ u.name }}
                </td>

            </ng-container>

            <!-- E-mail -->
            <ng-container matColumnDef="email">

                <th mat-header-cell *matHeaderCellDef>
                    E-mail
                </th>

                <td mat-cell *matCellDef="let u">
                    {{ u.email }}
                </td>

            </ng-container>

            <!-- Empresa -->
            <ng-container matColumnDef="company">

                <th mat-header-cell *matHeaderCellDef>
                    Empresa
                </th>

                <td mat-cell *matCellDef="let u">
                    {{ getCompanyName(u.companyId) }}
                </td>

            </ng-container>

            <!-- Status -->
            <ng-container matColumnDef="status">

                <th mat-header-cell *matHeaderCellDef>
                    Status
                </th>

                <td mat-cell *matCellDef="let u">

          <span
                  class="status-badge"
                  [class.status-ativo]="u.active"
                  [class.status-inativo]="!u.active"
          >
            {{ u.active ? 'Ativo' : 'Inativo' }}
          </span>

                </td>

            </ng-container>

            <!-- Ações -->
            <ng-container matColumnDef="actions">

                <th
                        mat-header-cell
                        *matHeaderCellDef
                        style="text-align: right;"
                >
                    Ações
                </th>

                <td
                        mat-cell
                        *matCellDef="let u"
                        style="text-align: right;"
                >

                    <div class="actions-row">

                        <button
                                mat-icon-button
                                (click)="openUserDialog(u)"
                                matTooltip="Editar usuário"
                        >
                            <mat-icon>edit</mat-icon>
                        </button>

                        <button
                                mat-icon-button
                                (click)="toggleStatus(u)"
                                [matTooltip]="u.active ? 'Desativar' : 'Ativar'"
                        >
                            <mat-icon [color]="u.active ? 'accent' : 'warn'">
                                {{ u.active ? 'toggle_on' : 'toggle_off' }}
                            </mat-icon>
                        </button>

                        <button
                                mat-icon-button
                                (click)="resendInvite(u)"
                                matTooltip="Reenviar convite / Redefinir senha"
                        >
                            <mat-icon color="accent">
                                mail
                            </mat-icon>
                        </button>

                    </div>

                </td>

            </ng-container>

            <!-- HEADER -->
            <tr
                    mat-header-row
                    *matHeaderRowDef="displayedColumns"
            >
            </tr>

            <!-- ROW -->
            <tr
                    mat-row
                    *matRowDef="let row; columns: displayedColumns;"
            >
            </tr>

            <!-- EMPTY -->
            <tr
                    class="mat-row"
                    *matNoDataRow
            >
                <td
                        class="mat-cell"
                        colspan="5"
                        style="text-align: center; padding: 2rem;"
                >
                    Nenhum usuário encontrado.
                </td>
            </tr>

        </table>

    </div>
</div>
