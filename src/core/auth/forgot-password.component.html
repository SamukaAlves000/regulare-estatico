<div class="login-page">

    <div class="login-card">
        <img class="logo logo-mvn-out" src="assets/images/logo-regulare.png" alt="REGULARE"/>

        <ng-container *ngIf="state() !== 'success'; else successBlock">
            <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">

                <p class="form-title">Redefinir senha</p>
                <p class="form-hint">Informe o e-mail cadastrado e enviaremos instruções para redefinição.</p>

                <mat-form-field appearance="outline" class="full field">
                    <mat-label>E-mail</mat-label>
                    <input matInput type="email" formControlName="email" autocomplete="email"/>
                    <mat-error *ngIf="form.get('email')?.hasError('required')">E-mail obrigatório</mat-error>
                    <mat-error *ngIf="form.get('email')?.hasError('email')">Formato de e-mail inválido</mat-error>
                </mat-form-field>

                <button
                    mat-flat-button
                    color="primary"
                    class="full submit"
                    type="submit"
                    [disabled]="form.invalid || loading"
                >
                    <mat-spinner *ngIf="loading" diameter="20" class="btn-spinner"></mat-spinner>
                    <span *ngIf="!loading">Enviar instruções</span>
                </button>

                <a routerLink="/login" class="back-link">Voltar ao login</a>

                <div class="login-logos">
                    <img class="logo logo-regulare" src="assets/images/logo-min.png" alt="REGULARE"/>
                </div>
            </form>
        </ng-container>

        <ng-template #successBlock>
            <div class="login-form success-block">
                <p class="success-icon">✉️</p>
                <p class="success-title">Instruções enviadas</p>
                <p class="success-msg">
                    Se o e-mail estiver cadastrado, enviaremos instruções para redefinição de senha.
                </p>
                <a routerLink="/login" mat-flat-button color="primary" class="full submit">
                    Voltar ao login
                </a>
                <div class="login-logos">
                    <img class="logo logo-regulare" src="assets/images/logo-min.png" alt="REGULARE"/>
                </div>
            </div>
        </ng-template>
    </div>

</div>
